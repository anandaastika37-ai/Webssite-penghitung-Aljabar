{# Sidebar. Daftar menu datang dari MENU di app.py (lewat context_processor). #}
<input type="checkbox" id="sidebar-toggle" class="peer sr-only">

<!-- Tombol buka (hanya mobile) -->
<label for="sidebar-toggle"
       class="fixed left-3 top-3 z-20 inline-flex size-10 cursor-pointer items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 shadow-sm hover:bg-slate-50 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-600 peer-checked:hidden lg:hidden">
    <span class="sr-only">Buka menu</span>
    <i class="fa-solid fa-bars" aria-hidden="true"></i>
</label>

<!-- Latar gelap; klik untuk menutup (hanya mobile) -->
<label for="sidebar-toggle"
       class="fixed inset-0 z-30 hidden bg-slate-900/40 peer-checked:block lg:peer-checked:hidden"
       aria-hidden="true"></label>

<aside id="sidebar"
       class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-200 motion-reduce:transition-none peer-checked:translate-x-0 lg:translate-x-0">

    <!-- Judul -->
    <div class="flex items-center gap-3 border-b border-slate-100 px-4 py-4">
        <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-blue-600 text-lg text-white">
            <i class="fa-solid fa-square-root-variable" aria-hidden="true"></i>
        </span>
        <div class="min-w-0 flex-1">
            <p class="truncate font-semibold text-slate-900">Aljabar Linear</p>
            <p class="truncate text-sm text-slate-500">Catatan matriks &amp; vektor</p>
        </div>

        <!-- Tombol tutup (hanya mobile) -->
        <label for="sidebar-toggle"
               class="inline-flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 lg:hidden">
            <span class="sr-only">Tutup menu</span>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </label>
    </div>

    <!-- Daftar menu -->
    <nav aria-label="Daftar materi" class="flex-1 overflow-y-auto p-3">
        <ul class="space-y-1">
            {% for item in menu %}
            <li>
                <a href="{{ url_for(item.endpoint) }}"
                   {% if request.endpoint == item.endpoint %}aria-current="page"{% endif %}
                   class="group flex items-center gap-3 rounded-lg px-2.5 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 aria-[current=page]:bg-blue-50 aria-[current=page]:font-medium aria-[current=page]:text-blue-700">
                    <span class="grid size-8 shrink-0 place-items-center rounded-md bg-slate-100 text-[13px] text-slate-500 transition-colors group-hover:bg-blue-100 group-hover:text-blue-600 group-aria-[current=page]:bg-blue-600 group-aria-[current=page]:text-white">
                        <i class="fa-solid {{ item.icon }}" aria-hidden="true"></i>
                    </span>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </nav>
</aside>
